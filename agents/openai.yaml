interface:
  display_name: "SprintPilot"
  short_description: "AI assistant for sprint planning and Agile workflows"
  default_prompt: "Use $sprintpilot to shape sprint scope, triage queues, balance load, inspect sprint health, surface risks, and prepare progress, standup, and retrospective summaries. Keep owner changes approval-gated."

dependencies:
  tools:
    - type: "mcp"
      value: "mcp-atlassian"
      description: "Atlassian MCP tools for Jira and Confluence operations"

policy:
  allow_implicit_invocation: true
