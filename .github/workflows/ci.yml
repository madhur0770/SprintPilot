name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-test:
    name: ${{ matrix.os }} / ${{ matrix.shell }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, shell: powershell }   # Windows PowerShell 5.1
          - { os: windows-latest, shell: pwsh }         # PowerShell 7
          - { os: ubuntu-latest,  shell: pwsh }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate repository content
        run: python scripts/validate_sprintpilot.py
      - name: Offline demo runs and matches the committed sample report
        shell: ${{ matrix.shell }}
        run: |
          .\scripts\demo-sprintpilot.ps1
          $actual = (Get-Content -Raw automation/output/offline-demo-report.md) -replace "`r`n", "`n"
          $expected = (Get-Content -Raw examples/sample-report.md) -replace "`r`n", "`n"
          if ($actual -ne $expected) { throw 'Demo output differs from examples/sample-report.md' }
      - name: Unit tests
        env:
          SPRINTPILOT_TEST_PWSH: ${{ matrix.shell }}
        run: python -m unittest discover -s tests -v

  shell-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: for f in automation/*.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: shellcheck --severity=error automation/*.sh
